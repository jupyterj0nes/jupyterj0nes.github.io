<text x="86" y="138" font-family="'Libre Franklin', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#f6eedd" text-anchor="start" font-weight="600">Level 1 · What is still described</text>
<text x="86" y="166" font-family="'Libre Franklin', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa8bb" text-anchor="start" font-weight="400">Always read. It costs nothing.</text>
