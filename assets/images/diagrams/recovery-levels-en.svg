<text x="646" y="166" font-family="'Libre Franklin', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9aa8bb" text-anchor="start" font-weight="400">The whole disk has to be read, byte by byte.</text>
