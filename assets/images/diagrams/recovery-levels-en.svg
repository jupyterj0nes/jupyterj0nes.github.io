<circle cx="108" cy="208" r="5" fill="#58c98f"/>
<text x="128" y="214" font-family="'Libre Franklin', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#c3cdda" text-anchor="start" font-weight="400">Unused $MFT records</text>
