<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="The hunt_score scale">
<defs><radialGradient id="g" cx="0.5" cy="0.1" r="1"><stop offset="0" stop-color="#14213a"/><stop offset="0.7" stop-color="#0b1322"/><stop offset="1" stop-color="#070c15"/></radialGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa8bb"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3a44f"/></marker></defs>
<rect width="1200" height="400" fill="url(#g)"/>
<text x="60" y="62" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="28" fill="#f6eedd" text-anchor="start" font-weight="600">hunt_score measures rarity, not confidence</text>
<text x="60" y="96" font-family="'Libre Franklin', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#9aa8bb" text-anchor="start" font-weight="400">Every ten points, ten times rarer.</text>
<defs><linearGradient id="sc" x1="0" x2="1"><stop offset="0" stop-color="#2c4164"/><stop offset="0.3" stop-color="#7aa6f2"/><stop offset="0.6" stop-color="#e3a44f"/><stop offset="1" stop-color="#ef6a7d"/></linearGradient></defs>
<rect x="90" y="202" width="1020" height="16" rx="8" fill="url(#sc)"/>
<path d="M90 218 L90 234" stroke="#9aa8bb" stroke-width="2" fill="none"/>
<text x="90" y="266" font-family="'Space Mono', Consolas, Menlo, monospace" font-size="26" fill="#f6eedd" text-anchor="middle" font-weight="700">0</text>
<text x="90" y="292" font-family="'Libre Franklin', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa8bb" text-anchor="middle" font-weight="400">like any other</text>
<path d="M222.6 188 L222.6 202" stroke="#9aa8bb" stroke-width="2" fill="none"/>
<text x="222.6" y="148" font-family="'Space Mono', Consolas, Menlo, monospace" font-size="26" fill="#f6eedd" text-anchor="middle" font-weight="700">13</text>
<text x="222.6" y="176" font-family="'Libre Franklin', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa8bb" text-anchor="middle" font-weight="400">1 in 20</text>
<path d="M294 218 L294 234" stroke="#9aa8bb" stroke-width="2" fill="none"/>
<text x="294" y="266" font-family="'Space Mono', Consolas, Menlo, monospace" font-size="26" fill="#f6eedd" text-anchor="middle" font-weight="700">20</text>
<text x="294" y="292" font-family="'Libre Franklin', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa8bb" text-anchor="middle" font-weight="400">1 in 100</text>
<path d="M396 188 L396 202" stroke="#9aa8bb" stroke-width="2" fill="none"/>
<text x="396" y="148" font-family="'Space Mono', Consolas, Menlo, monospace" font-size="26" fill="#f6eedd" text-anchor="middle" font-weight="700">30</text>
<text x="396" y="176" font-family="'Libre Franklin', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa8bb" text-anchor="middle" font-weight="400">1 in 1,000</text>
<path d="M702 218 L702 234" stroke="#9aa8bb" stroke-width="2" fill="none"/>
<text x="702" y="266" font-family="'Space Mono', Consolas, Menlo, monospace" font-size="26" fill="#f6eedd" text-anchor="middle" font-weight="700">60</text>
<text x="702" y="292" font-family="'Libre Franklin', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa8bb" text-anchor="middle" font-weight="400">1 in a million</text>
<path d="M1110 218 L1110 234" stroke="#9aa8bb" stroke-width="2" fill="none"/>
<text x="1110" y="266" font-family="'Space Mono', Consolas, Menlo, monospace" font-size="26" fill="#f6eedd" text-anchor="middle" font-weight="700">100</text>
<text x="1110" y="292" font-family="'Libre Franklin', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#9aa8bb" text-anchor="middle" font-weight="400">the cap</text>
<rect x="60" y="322" width="1080" height="50" rx="8" fill="#0f1826" stroke="#2c4164" stroke-width="1.2"/>
<text x="600" y="354" font-family="'Libre Franklin', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#c3cdda" text-anchor="middle" font-weight="400">Two independent rules on the same row add their points:  39 + 39 = 78</text>
</svg>
